# Publish @nuccig/create-forge to npm when a v* tag is pushed.
#
# Setup (once):
#   1. Create an npm "Automation" access token (npmjs.com → Access Tokens).
#   2. Add it as a repo secret named NPM_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret).
#
# Release:
#   npm version patch        # bumps package.json + creates the vX.Y.Z commit & tag
#   git push --follow-tags   # pushes the commit and the tag → triggers this workflow
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write        # enables npm provenance on the published package

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Publish (public, with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
