# forge — Copier template configuration
# A portable, tool-agnostic agent harness (AGENTS.md + Spec-Driven Development).
# Docs: https://copier.readthedocs.io
#
# Usage:
#   copier copy gh:nuccig/forge my-project        # scaffold a new project
#   copier update                                  # pull harness improvements later

_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: ".jinja"
_envops:
  keep_trailing_newline: true

_message_after_copy: |
  forge scaffolded "{{ project_name }}".

  Next steps:
    1. Read AGENTS.md  — the canonical agent contract (every tool reads it).
    2. Fill the task commands in the justfile (or your chosen runner) so
       `just lint`, `just test`, `just build` actually run.
    3. After editing any skill in .agents/skills/, run `just sync-adapters`
       to refresh the Claude (.claude/) and Copilot (.github/) adapters.
    4. docs/sdd-workflow.md explains the spec -> plan -> tasks -> implement flow.

# ─── Identity ────────────────────────────────────────────────────────────────
project_name:
  type: str
  help: Human-readable project name
  default: My Project

project_slug:
  type: str
  help: Slug (kebab-case) for directories, branches, package names
  default: "{{ project_name | lower | trim | replace(' ', '-') | replace('_', '-') }}"

project_description:
  type: str
  help: One-line description of the project
  default: ""

author_name:
  type: str
  help: Primary author or org (used in LICENSE and CODEOWNERS)
  default: ""

year:
  type: str
  help: Copyright year (used in LICENSE)
  default: "2026"

# ─── Agent surface ───────────────────────────────────────────────────────────
primary_agent:
  type: str
  help: Primary coding agent (adapters are generated for the others regardless)
  choices:
    Claude Code: claude
    OpenAI Codex: codex
    Cursor: cursor
    GitHub Copilot: copilot
    Multiple / agnostic: multi
  default: claude

artifact_language:
  type: str
  help: Language the agent uses to talk to humans (skill bodies stay in English)
  choices:
    English: en
    Português (BR): pt-BR
    Español: es
  default: en

# ─── Integrations (optional adapters, graceful degradation) ──────────────────
issue_tracker:
  type: str
  help: Issue tracker for plan/SDD status sync (none = local-only)
  choices: [linear, github, none]
  default: github

issue_prefix:
  type: str
  help: Issue key prefix used in branches and PRs (e.g. ACME for ACME-42)
  default: "{{ project_slug[:4] | upper | replace('-', '') }}"
  when: "{{ issue_tracker != 'none' }}"

git_host:
  type: str
  choices: [github, gitlab, none]
  default: github

# ─── Task-runner abstraction (the stack-agnostic seam) ───────────────────────
task_runner:
  type: str
  help: How skills and CI invoke build commands
  choices: [just, make, npm, none]
  default: just

lint_cmd:
  type: str
  help: "Shell command for linting (empty = step skipped)"
  default: ""
typecheck_cmd:
  type: str
  help: "Shell command for type/static checks (empty = skipped)"
  default: ""
test_cmd:
  type: str
  help: "Shell command for the unit test suite (empty = skipped)"
  default: ""
build_cmd:
  type: str
  help: "Shell command for a production build (empty = skipped)"
  default: ""
e2e_cmd:
  type: str
  help: "Shell command for end-to-end tests (empty = skipped)"
  default: ""

runtime_paths:
  type: str
  help: Comma-separated globs that gate E2E / runtime checks in CI
  default: "src/**"

# Computed (hidden): the on-disk name of the task-runner file. Lets the single
# templated file render to justfile / Makefile / TASKS.md as appropriate.
task_file:
  type: str
  when: false
  default: "{% if task_runner == 'just' %}justfile{% elif task_runner == 'make' %}Makefile{% else %}TASKS.md{% endif %}"

# ─── Feature toggles ─────────────────────────────────────────────────────────
include_sdd:
  type: bool
  help: Include the spec -> plan -> tasks -> implement SDD pipeline
  default: true
include_pr_review_ai:
  type: bool
  help: Include the multi-agent AI PR-review skill and workflow
  default: true
include_hooks:
  type: bool
  help: Include the controller-write guard hook (Claude Code)
  default: true

license:
  type: str
  choices: [MIT, Apache-2.0, proprietary]
  default: MIT

# ─── Post-generation ─────────────────────────────────────────────────────────
# Rebuilds .claude/skills and .github/instructions from .agents/skills so the
# adapters reflect the chosen toggles. Requires Node >= 18. Always exits 0.
_tasks:
  - "node tools/sync-adapters.mjs --silent"

# ─── Exclusions ──────────────────────────────────────────────────────────────
_exclude:
  - "copier.yml"
  - "~*"
  - "*.bak"
  - "__pycache__"
  - ".git"
  - "{% if not include_sdd %}.agents/skills/sdd{% endif %}"
  - "{% if not include_sdd %}docs/sdd-workflow.md{% endif %}"
  - "{% if not include_pr_review_ai %}.agents/skills/pr-review{% endif %}"
  - "{% if not include_pr_review_ai %}.github/workflows/pr-review.yml{% endif %}"
  - "{% if not include_hooks %}.claude/hooks{% endif %}"
